# Static site, no build step. Security headers generated by harden.py (re-run after every build).
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-site"
    X-Permitted-Cross-Domain-Policies = "none"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-5O+EcV1rZDrQo9jPvd8WWqpBOH9NhU+gVm8QAO3ujVc=' 'sha256-CmRXlzIsRYsYpiexd91zjNLZlaglg6V8+Tv3iZWZ8EA=' 'sha256-HAFtqGgI9vBDR/nkOQg3bW0bhBmqg+wkEB/15uxBcRM=' 'sha256-Ss/qHHKNXgeIfRg5suhlGOHirDq8XjPL8N/uuOX4Se0=' 'sha256-enat00qyn+N3JicTJrNlI/SQeLoKIoBeqvASjFOVy1U=' 'sha256-f1B4SYO0BwZRhZWw52LLMY5pqb1SS5q57dJBG3Nz8j0=' 'sha256-idf1R/TmNjFc1rvJUBNr2rUv2qrOmPGjh0D8vxPhZDw=' 'sha256-kN7hlYXlm0jo0MCjq6WIjMNENG0xpgh5ODtdx2PlfKc=' 'sha256-uHCNUiQ61jN/LOPS9ugOsEv3FP7fqPLHT1ZtJyjjA84='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.reown.com; media-src 'self' blob: https:; connect-src 'self' https://mainnet.base.org https://sia.oaaprotocol.workers.dev https://api.dexscreener.com https://sourcify.dev wss://relay.walletconnect.org wss://relay.walletconnect.com https://*.walletconnect.org https://*.walletconnect.com https://api.web3modal.org https://*.web3modal.org https://*.reown.com; frame-src https://www.youtube-nocookie.com https://player.vimeo.com https://dexscreener.com https://verify.walletconnect.org https://verify.walletconnect.com https://secure.walletconnect.org https://secure-mobile.walletconnect.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

